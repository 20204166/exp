[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "system-analyzer"
description = "Local system dashboard and safe cleanup for the current machine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "UNLICENSED" }
dynamic = ["version"]
dependencies = [
    "psutil>=5.9",
    "send2trash>=1.8",
    'nvidia-ml-py>=12.0; platform_system != "Darwin"',
    "zeroconf>=0.131",
]

[project.scripts]
system-analyzer = "main:main"
system-analyzer-snapshot = "maintenance.snapshot:main"

[tool.setuptools.dynamic]
# The version lives in one place (maintenance/_version.py, a leaf module so
# setuptools can read it without importing Tkinter or optional runtime deps).
# maintenance._release bumps it automatically when a wheel is built.
version = { attr = "maintenance._version.__version__" }

[tool.setuptools]
# The app keeps its historical top-level modules (main/window/algo) as the
# public entry surface so `python main.py` and existing imports keep working;
# installing them as top-level py-modules preserves that exactly. The
# maintenance package (and its component/UI subpackages) carry the shared
# implementation, including the read-only snapshot command.
packages = [
    "maintenance",
    "maintenance.components",
    "maintenance.scanner_support",
    "maintenance.ui",
    "maintenance.ui.window_supports",
]
py-modules = [
    "main",
    "window",
    "algo",
]

[tool.setuptools.package-data]
# Ship the per-package READMEs so the built wheel matches the source manifest
# (maintenance._release diffs wheel members against source inputs), plus the
# PEP 561 typed marker.
"*" = ["*.md"]
maintenance = ["py.typed"]

[tool.mypy]
# In-tree `pip install .`/`pip install -e .` leaves build/ and *.egg-info/
# beside the sources; keep the documented `mypy --ignore-missing-imports .`
# gate clean by never type-checking those copies.
files = ["maintenance", "window.py", "main.py", "algo.py", "tests"]
exclude = "(^|/)(build|dist)/|(^|/).*\\.egg-info/"
